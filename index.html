<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Vietnam Monster World</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }
    #game-wrapper {
      width: 100%;
      max-width: 680px;
      background: #1e293b;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    #map-title {
      font-size: 20px;
      font-weight: 800;
      color: #fbbf24;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    canvas {
      width: 100%;
      max-width: 640px;
      height: auto;
      border-radius: 12px;
      border: 3px solid #f59e0b;
      display: block;
      background-color: #000;
      image-rendering: pixelated;
    }
    #dialog-box {
      width: 100%;
      margin-top: 12px;
      padding: 12px 16px;
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 10px;
      font-size: 14px;
      color: #cbd5e1;
      text-align: center;
    }
    /* Controls cho D-Pad Điện thoại */
    #dpad {
      display: grid;
      grid-template-columns: repeat(3, 48px);
      grid-template-rows: repeat(3, 48px);
      gap: 6px;
      margin-top: 14px;
    }
    .btn-pad {
      background: #334155;
      border: 2px solid #475569;
      border-radius: 10px;
      color: #f8fafc;
      font-size: 18px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .btn-pad:active {
      background: #f59e0b;
      color: #0f172a;
    }
    #btn-up { grid-column: 2; grid-row: 1; }
    #btn-left { grid-column: 1; grid-row: 2; }
    #btn-right { grid-column: 3; grid-row: 2; }
    #btn-down { grid-column: 2; grid-row: 3; }
  </style>
</head>
<body>

<div id="game-wrapper">
  <div id="header">
    <div id="map-title">Hà Nội – Monster World</div>
  </div>

  <canvas id="gameCanvas" width="640" height="480"></canvas>

  <div id="dialog-box">
    <span id="status-text">Hãy di chuyển sang mép bên phải để sang Vịnh Hạ Long!</span>
  </div>

  <!-- Nút điều khiển Mobile -->
  <div id="dpad">
    <div class="btn-pad" id="btn-up">▲</div>
    <div class="btn-pad" id="btn-left">◄</div>
    <div class="btn-pad" id="btn-right">►</div>
    <div class="btn-pad" id="btn-down">▼</div>
  </div>
</div>
