<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// 1. Khai báo danh sách đường dẫn ảnh (Lưu ý: Dùng đường dẫn tương đối, không có dấu / ở đầu)
const assetsToLoad = {
  tile_grass: 'tileset/vietnam_town.png',
  tile_main: 'tileset/tileset.png',
  bg_mekong: 'tileset/mekong_delta.png'
};

const images = {};
let loadedCount = 0;
const totalAssets = Object.keys(assetsToLoad).length;

// 2. Preloader: Tải toàn bộ ảnh trước khi vẽ
function loadAssets(onComplete) {
  for (let key in assetsToLoad) {
    images[key] = new Image();
    images[key].src = assetsToLoad[key];
    images[key].onload = () => {
      loadedCount++;
      if (loadedCount === totalAssets) {
        onComplete(); // Tải xong hết mới gọi hàm khởi chạy game
      }
    };
    images[key].onerror = () => {
      console.error("Lỗi không tải được file ảnh:", assetsToLoad[key]);
    };
  }
}

// 3. Hàm vẽ Game
function drawMap() {
  // Clear khung vẽ
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Ví dụ vẽ ảnh tile lên canvas
  if (images.tile_main) {
    ctx.drawImage(images.tile_main, 0, 0);
  }
  
  // Game Loop của bạn ở đây...
}

// 4. Bắt đầu game sau khi đã load xong 100% ảnh
loadAssets(() => {
  console.log("Đã tải xong toàn bộ tài nguyên!");
  drawMap();
});
</script>
